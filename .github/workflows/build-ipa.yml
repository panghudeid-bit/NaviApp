name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build NaviApp V2.5 IPA
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NaviApp.xcodeproj \
            -scheme NaviApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify build output
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NaviApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到编译产物 $APP_PATH"
            find build/Build/Products -maxdepth 2 || true
            exit 1
          fi
          echo "== .app 结构 =="
          ls -la "$APP_PATH"
          echo "== Info.plist 关键字段 =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"

      - name: Pack as IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/NaviApp.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          rm -rf "build/ipa/Payload/NaviApp.app/_CodeSignature"
          cd build/ipa
          zip -qry NaviApp-V2.5-unsigned.ipa Payload
          echo "== 打包完成 =="
          ls -lh NaviApp-V2.5-unsigned.ipa
          unzip -l NaviApp-V2.5-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviApp-V2.5-unsigned-ipa
          path: build/ipa/NaviApp-V2.5-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
