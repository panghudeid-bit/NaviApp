name: NaviApp

options:
  bundleIdPrefix: com.naviapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"

targets:
  NaviApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaviApp
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: NaviApp
        PRODUCT_BUNDLE_IDENTIFIER: com.naviapp.NaviApp
        INFOPLIST_FILE: NaviApp/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ONLY_ACTIVE_ARCH: "NO"

schemes:
  NaviApp:
    build:
      targets:
        NaviApp: all
    run:
      config: Debug
    archive:
      config: Release
